[versions]

# Core
java = "25"
jgrapht = "1.5.2"
money-api = "1.1"
moneta = "1.4.5"

# Infrastructure
spring-boot = "4.1.1"
spring = "7.0.9"
jackson = "2.21.5"
jackson-annotations = "2.21"
postgresql = "42.7.13"

# Development
jspecify = "1.0.1"

# Logging
slf4j = "2.0.18"
logback = "1.6.3"
logstash = "9.0"

# Testing
junit = "6.1.3"
groovy = "5.1.0"
spock = "2.4-groovy-5.0"
spock-gradle = "2.4-groovy-4.0"

# Quality
spotless = "8.10.0"
errorprone = "5.1.1"
errorprone-core = "2.50.0"
qodana = "2026.2.1"
jacoco = "0.8.15"
pitest = "1.19.0"
pitest-engine = "1.30.0"
pitest-junit = "1.0.0"
dependency-analysis = "3.18.0"


[plugins]
# Nothing here - the external plugins need to be added as implementation dependencies before they can be
# applied in precompiled script plugin (source: https://docs.gradle.org/current/userguide/custom_plugins.html#applying_external_plugins_in_precompiled_script_plugins)
# Gradle's `alias` can be used only on project level.

[libraries]

spring-boot-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
spring-boot = { module = "org.springframework.boot:spring-boot", version.ref = "spring-boot" }
spring-boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure", version.ref = "spring-boot" }
spring-context = { module = "org.springframework:spring-context", version.ref = "spring" }
spring-core = { module = "org.springframework:spring-core", version.ref = "spring" }
spring-beans = { module = "org.springframework:spring-beans", version.ref = "spring" }
spring-jdbc = { module = "org.springframework:spring-jdbc", version.ref = "spring" }
spring-tx = { module = "org.springframework:spring-tx", version.ref = "spring" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-core = { module = "com.fasterxml.jackson.core:jackson-core", version.ref = "jackson" }
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations", version.ref = "jackson-annotations" }

annotations = { module = "org.jspecify:jspecify", version.ref = "jspecify" }

slf4j = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
logstash-encoder = { module = "net.logstash.logback:logstash-logback-encoder", version.ref = "logstash" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }
groovy = { module = "org.apache.groovy:groovy", version.ref = "groovy" }
spock-bom = { module = "org.spockframework:spock-bom", version.ref = "spock" }
spock-gradle-bom = { module = "org.spockframework:spock-bom", version.ref = "spock-gradle" }
spock-core = { module = "org.spockframework:spock-core" }

spotless-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
errorprone-plugin = { module = "net.ltgt.errorprone:net.ltgt.errorprone.gradle.plugin", version.ref = "errorprone" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone-core" }
quodana-plugin = { module = "org.jetbrains.qodana:org.jetbrains.qodana.gradle.plugin", version.ref = "qodana" }
pitest-plugin =  { module = "info.solidsoft.pitest:info.solidsoft.pitest.gradle.plugin", version.ref = "pitest" }
dependency-analysis-plugin = { module = "com.autonomousapps:dependency-analysis-gradle-plugin", version.ref = "dependency-analysis" }

jgrapht-core = { module = "org.jgrapht:jgrapht-core", version.ref = "jgrapht" }

money-api = { module = "javax.money:money-api", version.ref = "money-api" }
moneta-core = { module = "org.javamoney.moneta:moneta-core", version.ref = "moneta" }
