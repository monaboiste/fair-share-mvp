spring.application.name=fair-share
spring.main.web-application-type=none
fairshare.database.url=${FAIRSHARE_DATABASE_URL:jdbc:postgresql://localhost:5432/fairshare}
fairshare.database.username=${FAIRSHARE_DATABASE_USERNAME:fairshare_dev}
fairshare.database.password=${FAIRSHARE_DATABASE_PASSWORD:local_dev_only}
fairshare.database.timeout-seconds=${FAIRSHARE_DATABASE_TIMEOUT_SECONDS:10}
fairshare.consumer.batch-limit=${FAIRSHARE_BATCH_LIMIT:64}
fairshare.consumer.poll-millis=${FAIRSHARE_POLL_MILLIS:100}
fairshare.consumer.retry-millis=${FAIRSHARE_RETRY_MILLIS:1000}
