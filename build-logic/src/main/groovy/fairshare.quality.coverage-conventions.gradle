plugins {
    id("jacoco")
}

jacoco {
    toolVersion = libs.versions.jacoco.get()
}

tasks.named("jacocoTestReport") {
    dependsOn(tasks.named("test"))

    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

tasks.register("coverageCheck") {
    group = "quality"
    dependsOn(tasks.named("jacocoTestReport"))
}

tasks.named("check") {
    dependsOn(tasks.named("coverageCheck"))
}
