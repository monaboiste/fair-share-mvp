services:
  postgres:
    image: postgres:18.3@sha256:7e32e9833a6fb1c92c32552794cb6ed569d51b445a54907d35fc112ef39684db
    environment:
      POSTGRES_DB: fairshare
      POSTGRES_USER: ${FAIRSHARE_DATABASE_USERNAME:-fairshare_dev}
      POSTGRES_PASSWORD: ${FAIRSHARE_DATABASE_PASSWORD:-local_dev_only}
    ports:
      - "127.0.0.1:${FAIRSHARE_DATABASE_PORT:-5432}:5432"
    volumes:
      - settlement-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  settlement-data:
